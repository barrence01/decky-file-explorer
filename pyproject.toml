[project]
name = "decky-file-explorer"
version = "1.0.0"
authors = [
  { name = "Will B.", email = "barrence.santos@gmail.com" },
]
description = "A file explorer plugin for Decky Loader"
readme = "README.md"
requires-python = ">=3.7"
license = { text = "BSD-3-Clause" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
    "Topic :: Desktop Environment",
]
keywords = ["decky", "plugin", "file-explorer", "steam-deck"]
dependencies = [
    "aiohttp == 3.13.2",
    "bcrypt >= 5.0.0"
]

[project.optional-dependencies]
test = [
    "pytest >= 8.0",
    "pytest-asyncio >= 0.24",
    "pytest-aiohttp >= 1.0",
    "pytest-cov >= 5.0",
]

[build-system]
requires = ["setuptools>=78.1.1"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/barrence01/decky-file-explorer"
Repository = "https://github.com/barrence01/decky-file-explorer.git"
Issues = "https://github.com/barrence01/decky-file-explorer/issues"
"Changelog" = "https://github.com/barrence01/decky-file-explorer/releases"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["defaults","py_modules","bin"]
include = ["decky_file_explorer*"] 

[tool.setuptools.package-data]
"decky_file_explorer" = [
    "*.json",
    "*.py",
    "*.css",
    "*.js",
    "*.html",
    "*.png",
    "*.svg",
    "*.ico",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "defaults/py_modules", "bin"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-ra", "--strict-markers"]
markers = [
    "asyncio: mark test as asyncio (pytest-asyncio)",
]